# Purpose: Alembic reads this section before loading migrations/env.py.
# Chinese explanations: see the dated backend-flow guide linked in backend/README.md.
# Keep this file ASCII: Alembic may read it with the Windows locale encoding.
[alembic]
# Locate migration files relative to this configuration file, not the caller's directory.
script_location = %(here)s/migrations
# Allow the migration environment to import the backend app package consistently.
prepend_sys_path = %(here)s
# Interpret path lists with the current operating system's path separator.
path_separator = os

# Settings reads the connection from the environment; never store credentials here.
